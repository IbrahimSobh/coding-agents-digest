<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <script>try{var t=localStorage.getItem('cad-theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/schibsted-grotesk-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/newsreader-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site"><div class="wrap hbar">
    <a class="brand" href="{{ '/' | relative_url }}"><img class="logo" src="{{ '/assets/favicon.svg' | relative_url }}" alt="" width="24" height="24">Coding Agents <span class="g">Digest</span></a>
    <nav>
      <a {% if page.url contains '/briefs/' %}class="on" {% endif %}href="{{ '/briefs/' | relative_url }}">Archive</a>
    </nav>
    <a class="tbtn" href="{{ '/feed.xml' | relative_url }}" title="RSS feed" aria-label="RSS feed"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><circle cx="2.5" cy="13.5" r="2.5"/><path d="M0 5.5v2.6a7.9 7.9 0 0 1 7.9 7.9h2.6A10.5 10.5 0 0 0 0 5.5z"/><path d="M0 0v2.6A13.4 13.4 0 0 1 13.4 16H16A16 16 0 0 0 0 0z"/></svg></a>
    <a class="tbtn" href="https://github.com/IbrahimSobh/coding-agents-digest" target="_blank" rel="noopener noreferrer" title="Source on GitHub" aria-label="Source on GitHub (opens in a new tab)"><svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
    <a class="tbtn" href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" title="{{ site.author }} on LinkedIn" aria-label="{{ site.author }} on LinkedIn (opens in a new tab)"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M0 1.15C0 .52.52 0 1.17 0h13.66C15.48 0 16 .52 16 1.15v13.7c0 .63-.52 1.15-1.17 1.15H1.17C.52 16 0 15.48 0 14.85zm4.83 12.24V6.17H2.43v7.22zM3.63 5.18c.84 0 1.36-.55 1.36-1.25-.02-.71-.52-1.25-1.34-1.25S2.3 3.22 2.3 3.93c0 .7.52 1.25 1.32 1.25zm4.9 8.21V9.36c0-.22.02-.43.08-.59.17-.43.57-.88 1.23-.88.87 0 1.22.66 1.22 1.63v3.87h2.4V9.25c0-2.22-1.18-3.25-2.76-3.25-1.27 0-1.84.7-2.16 1.19v.02h-.02l.02-.02V6.17H6.13c.03.68 0 7.22 0 7.22z"/></svg></a>
    <button type="button" class="tbtn" id="theme" title="Switch light / dark theme" aria-label="Switch to light theme"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
  </div><div class="wrap hsub"><span class="tagline">{{ site.description | remove: "." }}</span><span class="ncw hidden" id="ncw" data-last="{{ site.data.brief.updated }}"> · <svg class="hg" viewBox="0 0 24 24" aria-hidden="true"><path class="hg-sand top" d="M8 5h8l-4 6z"/><path class="hg-sand bot" d="M12 14l4 6H8z"/><path class="hg-frame" d="M6 2h12M6 22h12M7 2c0 5 5 6 5 10s-5 5-5 10M17 2c0 5-5 6-5 10s5 5 5 10"/></svg><span id="nextCheck"></span></span></div></header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="wrap site">
    <span>Checked twice a day by a Claude scheduled task. Every item links its source. Created by <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">{{ site.author }}</a>.</span>
    <span>Claude Code · Antigravity CLI · Codex CLI · Kilo Code · OpenCode · <a href="{{ '/briefs/' | relative_url }}">Archive</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a> · <a href="https://github.com/IbrahimSobh/coding-agents-digest" target="_blank" rel="noopener noreferrer">Source</a></span>
  </footer>
  <script>
  (function(){
    var root=document.documentElement, DAY=864e5;
    // Light / dark toggle, remembered per browser
    var tb=document.getElementById('theme');
    function tlabel(){if(tb) tb.setAttribute('aria-label','Switch to '+(root.dataset.theme==='light'?'dark':'light')+' theme')}
    if(tb) tb.onclick=function(){root.dataset.theme=root.dataset.theme==='light'?'dark':'light';tlabel();try{localStorage.setItem('cad-theme',root.dataset.theme)}catch(e){}};
    tlabel();
    // Header subtitle: shown at the top of the page, hidden once the reader scrolls.
    // Hide past 60px, show again only at the top: hiding shortens the header by ~20px,
    // which moves the scroll position, so a single threshold would flip back and forth.
    var hdr=document.querySelector('header.site');
    function onScroll(){
      if(!hdr) return;
      var y=window.scrollY, hidden=hdr.classList.contains('scrolled');
      if(!hidden&&y>60) hdr.classList.add('scrolled');
      else if(hidden&&y<=2) hdr.classList.remove('scrolled');
    }
    window.addEventListener('scroll',onScroll,{passive:true}); window.addEventListener('load',onScroll); onScroll();
    // "next check in about N h" / "checking now". The scheduled task runs at 08:30 and 23:30 Cairo time.
    var RUNS=[8*60+30,23*60+30], nc=document.getElementById('nextCheck');
    function cairoMinutes(){
      var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
      function v(t){return +p.filter(function(x){return x.type===t})[0].value}
      return v('hour')%24*60+v('minute');
    }
    // Relative times ("updated 3 h ago", "17 h ago"), exact time in the reader's own time zone on hover.
    // The page source keeps Cairo times, shown as they are if this script does not run.
    function ago(min){return min<1?'just now':min<60?min+' min ago':min<2880?Math.round(min/60)+' h ago':Math.round(min/1440)+' days ago'}
    function local(t){return t.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})+' (your time)'}
    function clock(){
      if(nc){
        var m=cairoMinutes(), txt;
        // "checking now" only while the latest scheduled run has not reached this page yet
        // (the brief is rebuilt on every run), and for at most 60 min so a failed run does not stick.
        var since=Math.min.apply(null,RUNS.map(function(r){return (m-r+1440)%1440}));
        var last=new Date(document.getElementById('ncw').dataset.last);
        var due=new Date(Date.now()-since*6e4-6e4);
        if(since<60&&!(last>=due)) txt='checking now';
        else{
          var left=Math.min.apply(null,RUNS.map(function(r){return (r-m+1440)%1440}));
          txt='next check '+(left>=90?'in about '+Math.round(left/60)+' h':left>=10?'in '+Math.round(left/5)*5+' min':'any minute now');
        }
        nc.textContent=txt;
        document.getElementById('ncw').classList.remove('hidden');
      }
      document.querySelectorAll('[data-updated]').forEach(function(el){
        var t=new Date(el.dataset.updated);
        if(isNaN(t)) return;
        el.textContent='updated '+ago(Math.round((Date.now()-t)/6e4));
        el.title=local(t);
      });
      // Timeline: each run time becomes "N h ago"; a quiet range shows its two ends, or one if they match
      document.querySelectorAll('[data-at]').forEach(function(el){
        var t=new Date(el.dataset.at);
        if(isNaN(t)) return;
        el.textContent=ago(Math.round((Date.now()-t)/6e4));
        el.title=local(t);
      });
      document.querySelectorAll('.quiet').forEach(function(q){
        var s=q.querySelectorAll('[data-at]');
        if(s.length===2&&s[0].textContent===s[1].textContent){s[1].style.display='none';if(s[0].nextSibling)s[0].nextSibling.textContent=''}
      });
    }
    clock(); setInterval(clock,6e4);
    function d0(s){return new Date(s+'T00:00:00')}
    var today=new Date(); today.setHours(0,0,0,0);
    // Countdowns and "flagged N days ago"
    document.querySelectorAll('[data-deadline]').forEach(function(el){
      var d=Math.round((d0(el.dataset.deadline)-today)/DAY);
      el.textContent=d>1?d+' days left':d===1?'1 day left':d===0?'today':'passed';
    });
    document.querySelectorAll('[data-flagged]').forEach(function(el){
      var d=Math.round((today-d0(el.dataset.flagged))/DAY);
      el.textContent=d<=0?'flagged today':d===1?'flagged yesterday':'flagged '+d+' days ago';
    });
    // Day headings: Today / Yesterday
    document.querySelectorAll('.day[data-date]').forEach(function(el){
      var d=Math.round((today-d0(el.dataset.date))/DAY);
      if(d===0) el.textContent='Today · '+el.textContent;
      else if(d===1) el.textContent='Yesterday · '+el.textContent;
    });
    // "Show all" on the board
    var mb=document.getElementById('moreActions');
    if(mb) mb.onclick=function(){document.querySelectorAll('.act.extra').forEach(function(a){a.classList.remove('hidden')});mb.remove();};
    // Tool filter
    var chips=[].slice.call(document.querySelectorAll('#filters .chip'));
    function apply(f){
      chips.forEach(function(c){c.classList.toggle('on',c.dataset.f===f);c.setAttribute('aria-pressed',c.dataset.f===f)});
      document.querySelectorAll('.tl .run').forEach(function(r){
        var tools=(r.dataset.tools||'').split(' ');
        r.classList.toggle('hidden',f!=='all'&&tools.indexOf(f)<0);
        r.querySelectorAll('.tool').forEach(function(t){t.classList.toggle('hidden',f!=='all'&&t.dataset.tool!==f)});
        r.querySelectorAll('.qrows').forEach(function(q){q.classList.toggle('hidden',f!=='all')});
      });
      document.querySelectorAll('.tl .quiet').forEach(function(q){q.classList.toggle('hidden',f!=='all')});
      try{localStorage.setItem('cad-filter',f)}catch(e){}
    }
    if(chips.length){
      chips.forEach(function(c){c.onclick=function(){apply(c.dataset.f)}});
      var saved='all';try{saved=localStorage.getItem('cad-filter')||'all'}catch(e){}
      if(!chips.some(function(c){return c.dataset.f===saved})) saved='all';
      apply(saved);
    }
  })();
  </script>
  <script>
  // Links to other sites open in a new tab, so the reader keeps the place on this page (replay pick, open cards).
  // Links on this site (Archive, other entries, # links) and the feed file stay in the same tab, so Back works.
  // It runs on the page itself, so entries written by the scheduled task and old entries are covered without edits.
  (function(){
    var main=document.querySelector('main');
    [].forEach.call(document.links,function(a){
      var u; try{u=new URL(a.href,location.href)}catch(e){return}
      if(!/^https?:$/.test(u.protocol)||u.hostname===location.hostname||/\.xml$/.test(u.pathname)) return;
      a.target='_blank'; a.rel='noopener noreferrer';
      // a cue only on links inside the text; the header icons and the footer are self-explanatory
      if(main&&main.contains(a)&&!a.querySelector('svg')){
        a.classList.add('ext');
        var s=document.createElement('span'); s.className='vh'; s.textContent=' (opens in a new tab)'; a.appendChild(s);
      }
    });
  })();
  </script>
</body>
</html>
